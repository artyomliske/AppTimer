name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-and-release:
    name: Build signed release artifact
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run unit tests
        run: make test
      - name: Build installer DMG
        run: make dmg BUILD_DIR=dist DERIVED_DATA="$RUNNER_TEMP/AppTimerDerivedData"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.dmg
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg dist/*.dmg.sha256 \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AppTimer ${GITHUB_REF_NAME#v}" \
            --generate-notes
